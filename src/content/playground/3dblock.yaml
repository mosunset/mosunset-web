title: 3DBlock | かんたん3D回転＆ブロック操作デモ
description: >-
  3Dブロックをドラッグでぐりぐり動かして、視点や形を自由に変えられるインタラクティブデモです。Web技術だけで3D表現や操作感を手軽に体験可能！回転・拡大縮小や、さまざまなブロック装飾で「触れる3D」の楽しさを気軽にチェック。ビジュアル学習やWebGL/Three.js入門にもぴったりです。
