title: インタラクティブBMI計算グラフ | 身長と体重で適正体重を視覚化
description: >-
  身長と体重のスライダーを自由に動かして、ご自身のBMI（体格指数）をインタラクティブなグラフで確認できる健康管理ツールです。入力に合わせてBMIの計算結果と「低体重」「普通体重」「肥満」などの肥満度判定がリアルタイムで更新され、体重の変化がBMIにどう影響するかを直感的に理解できます。日々の健康管理やダイエットの目標設定にお役立てください。
category: 健康・フィットネス
