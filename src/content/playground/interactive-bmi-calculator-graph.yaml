title: インタラクティブBMI計算グラフ | 身長・体重でわかる理想体重＆健康チェック
description: >-
  身長と体重をスライダーで動かすだけで、あなたのBMI（体格指数）や肥満度が即座にグラフ化されるビジュアルツール。数値の入力ごとに「低体重」「普通体重」「肥満」などの判定や、目標体重に向けたアドバイスがリアルタイムで表示されます。ダイエットの進捗確認や健康づくりの指標として、毎日のセルフチェックに活用できます。シンプル操作で楽しみながら健康管理を始めましょう！
