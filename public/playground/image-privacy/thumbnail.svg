<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f3f4f6"/>
      <rect width="20" height="20" fill="#d1d5db"/>
      <rect x="20" y="20" width="20" height="20" fill="#d1d5db"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="left"><rect width="400" height="600"/></clipPath>
    <clipPath id="right"><rect x="400" width="400" height="600"/></clipPath>
    <clipPath id="face"><ellipse cx="400" cy="205" rx="66" ry="80"/></clipPath>
  </defs>

  <!-- 左: 元の写真（公園） -->
  <g clip-path="url(#left)">
    <rect width="800" height="600" fill="url(#sky)"/>
    <rect y="400" width="800" height="200" fill="#4ade80"/>
    <circle cx="90" cy="300" r="90" fill="#16a34a"/>
    <rect x="80" y="330" width="20" height="90" fill="#78350f"/>
    <circle cx="260" cy="270" r="70" fill="#22c55e"/>
    <rect x="252" y="300" width="16" height="110" fill="#78350f"/>
    <rect x="30" y="440" width="140" height="14" rx="4" fill="#a16207"/>
    <circle cx="70" cy="90" r="40" fill="#fde68a"/>
  </g>
  <!-- 右: 背景を消した（透明） -->
  <g clip-path="url(#right)">
    <rect width="800" height="600" fill="url(#checker)"/>
  </g>

  <!-- 人物 -->
  <path d="M250 600 C250 420 310 330 400 330 C490 330 550 420 550 600 Z" fill="#1e3a8a"/>
  <rect x="375" y="270" width="50" height="70" rx="20" fill="#f1c7a5"/>
  <ellipse cx="400" cy="205" rx="62" ry="76" fill="#f1c7a5"/>
  <path d="M338 200 C335 130 465 120 462 200 C455 160 345 160 338 200 Z" fill="#3f2a1d"/>
  <!-- 顔をぼかした部分 -->
  <g clip-path="url(#face)">
    <g filter="url(#blur)">
      <rect x="320" y="110" width="160" height="200" fill="#f1c7a5"/>
      <path d="M338 200 C335 130 465 120 462 200 C455 160 345 160 338 200 Z" fill="#3f2a1d"/>
      <ellipse cx="378" cy="205" rx="9" ry="6" fill="#3f2a1d"/>
      <ellipse cx="422" cy="205" rx="9" ry="6" fill="#3f2a1d"/>
      <path d="M380 250 Q400 262 420 250" stroke="#b45309" stroke-width="5" fill="none"/>
    </g>
  </g>
  <!-- 見つけた顔の枠 -->
  <rect x="326" y="112" width="148" height="182" fill="none" stroke="#22c55e" stroke-width="5"/>

  <!-- 境目 -->
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <line x1="400" y1="0" x2="400" y2="112" stroke="#111827" stroke-width="1" opacity="0.4"/>

  <!-- 題 -->
  <rect x="0" y="520" width="800" height="80" fill="#111827" opacity="0.82"/>
  <text x="400" y="572" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">背景除去・顔のぼかし</text>
</svg>
