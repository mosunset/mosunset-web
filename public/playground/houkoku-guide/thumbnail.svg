    <rect x="216" y="318" width="72" height="16"/>
    <rect x="348" y="318" width="72" height="16"/>
    <rect x="480" y="318" width="72" height="16"/>
    <rect x="612" y="318" width="72" height="16"/>
  </g>
  <g fill="#9c9c9c">
    <rect x="94" y="346" width="52" height="9"/>
    <rect x="226" y="346" width="52" height="9"/>
    <rect x="358" y="346" width="52" height="9"/>
    <rect x="490" y="346" width="52" height="9"/>
    <rect x="622" y="346" width="52" height="9"/>
