<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432">
  <rect width="768" height="432" fill="#ffffff"/>
  <rect width="768" height="18" fill="#111111"/>

  <!-- 点で話す: ばらばらの灰色の言葉 -->
  <g fill="#ffffff" stroke="#8a8a8a" stroke-width="3">
    <rect x="70" y="78" width="120" height="40" transform="rotate(3 130 98)"/>
    <rect x="222" y="70" width="96" height="40" transform="rotate(-5 270 90)"/>
    <rect x="352" y="84" width="150" height="40"/>
    <rect x="534" y="74" width="84" height="40" transform="rotate(3 576 94)"/>
    <rect x="648" y="86" width="64" height="40" transform="rotate(-5 680 106)"/>
  </g>
  <g fill="#bdbdbd">
