<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <clipPath id="big"><rect x="96" y="96" width="248" height="186" rx="10"/></clipPath>
    <clipPath id="small"><rect x="486" y="146" width="160" height="120" rx="8"/></clipPath>
  </defs>
  <rect width="768" height="432" fill="url(#bg)"/>

  <!-- 元の写真（大きい） -->
  <g filter="url(#shadow)">
    <rect x="84" y="84" width="272" height="250" rx="16" fill="#fff"/>
  </g>
  <g clip-path="url(#big)">
    <rect x="96" y="96" width="248" height="186" fill="url(#sky)"/>
    <circle cx="290" cy="140" r="22" fill="#fde68a"/>
    <path d="M96 282 L170 190 L220 245 L262 200 L344 282 Z" fill="#a7f3d0"/>
    <path d="M96 282 L150 232 L200 282 Z" fill="#6ee7b7"/>
  </g>
  <!-- 元の写真に入っていた EXIF -->
  <g font-family="sans-serif" font-size="15" fill="#64748b">
    <circle cx="112" cy="308" r="7" fill="#fdba74"/>
    <text x="126" y="313">GPS</text>
    <circle cx="180" cy="308" r="7" fill="#c4b5fd"/>
    <text x="194" y="313">Camera</text>
    <text x="344" y="313" text-anchor="end" font-family="monospace" fill="#334155">4.8 MB</text>
  </g>

  <!-- 矢印 -->
  <g fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 209 H446"/>
    <path d="M430 191 L450 209 L430 227"/>
  </g>
  <!-- 消える位置情報 -->
  <g transform="translate(402 118)">
    <path d="M14 0 C6 0 0 6 0 14 C0 25 14 38 14 38 C14 38 28 25 28 14 C28 6 22 0 14 0 Z" fill="#fed7aa"/>
    <circle cx="14" cy="14" r="5" fill="#fff"/>
    <path d="M-4 -2 L32 40" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 変換後（小さい） -->
  <g filter="url(#shadow)">
    <rect x="476" y="136" width="180" height="182" rx="14" fill="#fff"/>
  </g>
  <g clip-path="url(#small)">
    <rect x="486" y="146" width="160" height="120" fill="url(#sky)"/>
    <circle cx="611" cy="174" r="14" fill="#fde68a"/>
    <path d="M486 266 L534 207 L566 242 L593 213 L646 266 Z" fill="#a7f3d0"/>
    <path d="M486 266 L521 234 L553 266 Z" fill="#6ee7b7"/>
  </g>
  <g font-family="sans-serif">
    <text x="490" y="298" font-size="15" font-family="monospace" fill="#334155">920 KB</text>
    <rect x="574" y="282" width="70" height="24" rx="12" fill="#bbf7d0"/>
    <text x="609" y="299" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">−81%</text>
  </g>
  <!-- WebP の札 -->
  <rect x="610" y="116" width="66" height="30" rx="15" fill="#ddd6fe"/>
  <text x="643" y="136" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#5b21b6">WebP</text>

  <text x="384" y="392" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#334155">画像の圧縮・変換</text>
</svg>
