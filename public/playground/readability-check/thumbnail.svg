<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3cc"/>
      <stop offset="1" stop-color="#f4f8f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 文書（色のついた部分 = 指摘） -->
  <rect x="250" y="50" width="440" height="330" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="290" y="95" width="360" height="20" rx="10" fill="#e5e7eb"/>
  <rect x="290" y="91" width="110" height="28" rx="6" fill="#fbbf24" opacity="0.45"/>
  <rect x="290" y="145" width="300" height="20" rx="10" fill="#e5e7eb"/>
  <rect x="410" y="141" width="100" height="28" rx="6" fill="#10b981" opacity="0.35"/>
  <rect x="290" y="195" width="360" height="20" rx="10" fill="#e5e7eb"/>
  <path d="M290 230 q9 -9 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="290" y="260" width="320" height="20" rx="10" fill="#e5e7eb"/>
  <rect x="480" y="256" width="130" height="28" rx="6" fill="#ef4444" opacity="0.3"/>
  <rect x="290" y="310" width="220" height="20" rx="10" fill="#e5e7eb"/>
  <rect x="290" y="306" width="80" height="28" rx="6" fill="#d946ef" opacity="0.3"/>
  <!-- 虫めがね -->
  <g filter="url(#shadow)">
    <line x1="640" y1="330" x2="700" y2="390" stroke="#1f2937" stroke-width="20" stroke-linecap="round"/>
    <circle cx="595" cy="285" r="62" fill="#ecfeff" fill-opacity="0.75" stroke="#1f2937" stroke-width="12"/>
    <rect x="560" y="274" width="70" height="22" rx="6" fill="#ef4444" opacity="0.45"/>
  </g>
  <!-- スコア -->
  <g filter="url(#shadow)">
    <rect x="70" y="110" width="160" height="120" rx="20" fill="#e0f2f1"/>
  </g>
  <text x="150" y="185" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="bold" fill="#0f766e">82</text>
  <text x="150" y="214" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f766e">SCORE</text>
  <!-- タイトル -->
  <rect x="40" y="380" width="330" height="48" rx="14" fill="#374151"/>
  <text x="205" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">読みやすさチェック</text>
</svg>
