<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#e0f2fe"/>
  <!-- 床 -->
  <polygon points="400,520 700,370 400,220 100,370" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <!-- 箱: 等角投影。上面・左面・右面の 3 色 -->
  <g stroke="#1f2937" stroke-width="3" stroke-linejoin="round">
    <!-- 奥の高い箱 -->
    <polygon points="400,130 520,190 400,250 280,190" fill="#fcd34d"/>
    <polygon points="280,190 400,250 400,370 280,310" fill="#f59e0b"/>
    <polygon points="400,250 520,190 520,310 400,370" fill="#d97706"/>
    <!-- 左の箱 -->
    <polygon points="250,270 350,320 250,370 150,320" fill="#86efac"/>
    <polygon points="150,320 250,370 250,440 150,390" fill="#4ade80"/>
    <polygon points="250,370 350,320 350,390 250,440" fill="#16a34a"/>
    <!-- 右の箱 -->
    <polygon points="560,270 650,315 560,360 470,315" fill="#93c5fd"/>
    <polygon points="470,315 560,360 560,430 470,385" fill="#60a5fa"/>
    <polygon points="560,360 650,315 650,385 560,430" fill="#2563eb"/>
    <!-- 手前の低い箱 -->
    <polygon points="400,350 500,400 400,450 300,400" fill="#f9a8d4"/>
    <polygon points="300,400 400,450 400,490 300,440" fill="#f472b6"/>
    <polygon points="400,450 500,400 500,440 400,490" fill="#db2777"/>
  </g>
  <!-- 上面の文字 -->
  <g font-family="sans-serif" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="400" y="200" font-size="34">上</text>
    <text x="250" y="330" font-size="26">上</text>
    <text x="560" y="325" font-size="24">上</text>
    <text x="400" y="410" font-size="26">上</text>
  </g>
</svg>
